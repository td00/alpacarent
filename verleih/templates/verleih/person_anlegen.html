{% extends 'verleih/base.html' %}
{% block content %}
<h2>Teilnehmer*in anlegen</h2>

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_teilnehmer_id">Teilnehmer*innen Code</label>
        {{ form.teilnehmer_id }}
        {% if form.teilnehmer_id.errors %}
            <div class="text-danger">{{ form.teilnehmer_id.errors.0 }}</div>
        {% endif %}
        <button type="button" class="btn btn-secondary mt-2" onclick="startPersonScanner()"><i class="bi bi-camera"></i></button>
        <div id="reader-person" style="width: 300px; display: none;" class="mt-2 mb-3"></div>
    </div>

    <div class="form-group">
        <label for="id_name">Name</label>
        {{ form.name }}
    </div>

    <div class="form-group">
        <label for="id_projekt">Projekt</label>
        {{ form.projekt }}
    </div>

    <button type="submit" class="btn btn-primary mt-3">Anlegen</button>
</form>

<script src="/static/qrcode.js"></script>
<script>
function startPersonScanner() {
    const reader = new Html5Qrcode("reader-person");
    document.getElementById("reader-person").style.display = "block";
    reader.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        qrCodeMessage => {
            document.getElementById("id_teilnehmer_id").value = qrCodeMessage.trim();
            reader.stop().then(() => {
                document.getElementById("reader-person").style.display = "none";
            });
        },
        errorMessage => {
            console.warn("QR-Fehler (Teilnehmer*in):", errorMessage);
        }
    );
}
</script>
{% endblock %}
